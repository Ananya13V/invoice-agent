[project]
name = "invoice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard]>=0.128.8",
    "psycopg[binary]>=3.2.13",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.55",
]

[project.scripts]
invoice-agent = "invoice_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
